name: Publish editorial package

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_editorial.py'
      - 'scripts/fix_article_images.py'
      - 'scripts/fix_branding.py'
      - 'scripts/fix_generated_text.py'
      - 'scripts/fix_breadcrumb_schema.py'
      - 'scripts/merge_sitemap_entries.py'
      - '.github/workflows/publish-editorial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot current sitemap
        run: cp sitemap.xml /tmp/interface-report-sitemap-before.xml
      - name: Generate editorial pages
        run: python scripts/publish_editorial.py
      - name: Restore non-editorial sitemap entries
        run: python scripts/merge_sitemap_entries.py /tmp/interface-report-sitemap-before.xml
      - name: Apply topic-specific article images
        run: python scripts/fix_article_images.py
      - name: Normalize canonical branding and organization schema
        run: python scripts/fix_branding.py
      - name: Repair deterministic generated-text corruption
        run: python scripts/fix_generated_text.py
      - name: Ensure article breadcrumb schema
        run: python scripts/fix_breadcrumb_schema.py
      - name: Validate September 12 package
        run: |
          python - <<'PY'
          import json, pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path('.')
          corruption = re.compile(r'\b(?:iona|ionas|ionience)\b', re.I)
          schema_re = re.compile(r'<script\s+type=["\']application/ld\+json["\']>(.*?)</script>', re.S | re.I)
          slugs = [
              'data-agent-kills-dashboard-first-analytics',
              'gpt-6-astra-model-is-not-the-product',
              'agents-api-build-vs-orchestrate',
              'agent-harness-portability-infrastructure',
              'permission-ux-is-ai-safety-interface',
              'evidence-loop-ai-analytics-trust',
              'full-duplex-voice-ui-design-rules',
              'stop-making-every-ai-feature-chat',
              'production-agent-sandbox-checklist',
              'tail-latency-ai-product-engineering',
              'ai-pricing-is-a-product-system',
              'agent-ready-saas-nonhuman-buyer',
          ]
          canonicals = set()
          for slug in slugs:
              p = root / 'analysis' / slug / 'index.html'
              assert p.exists(), f'missing {p}'
              text = p.read_text(encoding='utf-8')
              assert text.count('<h1') == 1, f'expected one H1 in {slug}'
              assert '<link rel="canonical"' in text, f'missing canonical in {slug}'
              assert 'application/ld+json' in text, f'missing Article JSON-LD in {slug}'
              assert '2026-09-12' in text, f'wrong publication date in {slug}'
              assert 'Interface Report Editorial Desk' in text, f'missing editorial byline in {slug}'
              assert '/assets/og-default.png' not in text, f'default publisher art leaked into article image in {slug}'
              assert '/assets/interface-report-logo.png' in text, f'missing canonical brand asset in {slug}'
              assert '"width":1536' in text and '"height":768' in text, f'missing canonical logo dimensions in {slug}'
              assert not corruption.search(text), f'generated-text corruption remains in {slug}'
              schema_match = schema_re.search(text)
              assert schema_match, f'JSON-LD parse failed in {slug}'
              graph = json.loads(schema_match.group(1)).get('@graph', [])
              breadcrumbs = [node for node in graph if isinstance(node, dict) and node.get('@type') == 'BreadcrumbList']
              assert len(breadcrumbs) == 1, f'expected exactly one BreadcrumbList in {slug}'
              assert len(breadcrumbs[0].get('itemListElement', [])) >= 2, f'incomplete BreadcrumbList in {slug}'
              match = re.search(r'<link rel="canonical" href="([^"]+)"', text)
              assert match, f'canonical parse failed in {slug}'
              assert match.group(1) not in canonicals, f'duplicate canonical in {slug}'
              canonicals.add(match.group(1))
          feed = pathlib.Path('feed.xml').read_text(encoding='utf-8')
          assert not corruption.search(feed), 'generated-text corruption remains in feed'
          ET.parse('sitemap.xml')
          ET.parse('news-sitemap.xml')
          ET.parse('feed.xml')
          print(f'validated {len(slugs)} September 12 articles plus XML')
          PY
      - name: Run full-site SEO QA
        run: |
          pip install -r requirements.txt
          python scripts/check_site.py
      - name: Commit generated editorial package
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'Interface Report Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis authors/editorial-desk latest topics sitemap.xml news-sitemap.xml feed.xml robots.txt 404.html
          git commit -m 'Publish September 12, 2026 editorial package [skip ci]'
          git push
