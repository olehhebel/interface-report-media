name: Publish editorial package

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_editorial.py'
      - 'scripts/fix_article_images.py'
      - '.github/workflows/publish-editorial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate editorial pages
        run: python scripts/publish_editorial.py
      - name: Apply topic-specific article images
        run: python scripts/fix_article_images.py
      - name: Validate September 12 package
        run: |
          python - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path('.')
          slugs = [
              'data-agent-kills-dashboard-first-analytics',
              'gpt-6-astra-model-is-not-the-product',
              'agents-api-build-vs-orchestrate',
              'agent-harness-portability-infrastructure',
              'permission-ux-is-ai-safety-interface',
              'evidence-loop-ai-analytics-trust',
              'full-duplex-voice-ui-design-rules',
              'stop-making-every-ai-feature-chat',
              'production-agent-sandbox-checklist',
              'tail-latency-ai-product-engineering',
              'ai-pricing-is-a-product-system',
              'agent-ready-saas-nonhuman-buyer',
          ]
          canonicals = set()
          for slug in slugs:
              p = root / 'analysis' / slug / 'index.html'
              assert p.exists(), f'missing {p}'
              text = p.read_text(encoding='utf-8')
              assert text.count('<h1') == 1, f'expected one H1 in {slug}'
              assert '<link rel="canonical"' in text, f'missing canonical in {slug}'
              assert 'application/ld+json' in text, f'missing Article JSON-LD in {slug}'
              assert '2026-09-12' in text, f'wrong publication date in {slug}'
              assert 'Interface Report Editorial Desk' in text, f'missing editorial byline in {slug}'
              assert '/assets/og-default.png' not in text, f'default publisher art leaked into article image in {slug}'
              match = re.search(r'<link rel="canonical" href="([^"]+)"', text)
              assert match, f'canonical parse failed in {slug}'
              assert match.group(1) not in canonicals, f'duplicate canonical in {slug}'
              canonicals.add(match.group(1))
          ET.parse('sitemap.xml')
          ET.parse('news-sitemap.xml')
          ET.parse('feed.xml')
          print(f'validated {len(slugs)} September 12 articles plus XML')
          PY
      - name: Run full-site SEO QA
        run: |
          pip install -r requirements.txt
          python scripts/check_site.py
      - name: Commit generated editorial package
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'Interface Report Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis authors/editorial-desk latest topics sitemap.xml news-sitemap.xml feed.xml robots.txt 404.html
          git commit -m 'Publish September 12, 2026 editorial package [skip ci]'
          git push
