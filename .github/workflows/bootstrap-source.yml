name: Bootstrap Interface Report source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, 'Bootstrap full Interface Report source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether bootstrap is needed
        id: gate
        shell: bash
        run: |
          if [[ -f index.html && -f sitemap.xml && -f robots.txt && -f assets/styles.css ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch current verified publication source
        if: steps.gate.outputs.needed == 'true'
        env:
          SITE: https://interface-report-media.vercel.app
          SHARE: J46687oa5XmZ8LbbnqlcObkFzregQyQk
        shell: bash
        run: |
          set -euo pipefail
          get() {
            local route="$1" out="$2"
            mkdir -p "$(dirname "$out")"
            curl --fail --location --retry 3 "${SITE}${route}?_vercel_share=${SHARE}" -o "$out"
            test -s "$out"
          }
          get / index.html
          get /404.html 404.html
          get /about/ about/index.html
          get /advertise/ advertise/index.html
          get /analysis/agent-ux-patterns/ analysis/agent-ux-patterns/index.html
          get /analysis/ai-agent-control-surface/ analysis/ai-agent-control-surface/index.html
          get /analysis/trust-before-intelligence/ analysis/trust-before-intelligence/index.html
          get /authors/oleh-hebel/ authors/oleh-hebel/index.html
          get /contact/ contact/index.html
          get /corrections/ corrections/index.html
          get /editorial-guidelines/ editorial-guidelines/index.html
          get /latest/ latest/index.html
          get /media-kit/ media-kit/index.html
          get /privacy/ privacy/index.html
          get /sponsored-content-policy/ sponsored-content-policy/index.html
          get /submissions/ submissions/index.html
          get /terms/ terms/index.html
          get /topics/ai-agents/ topics/ai-agents/index.html
          get /topics/ai-products/ topics/ai-products/index.html
          get /topics/design-ux/ topics/design-ux/index.html
          get /topics/engineering/ topics/engineering/index.html
          get /topics/human-ai/ topics/human-ai/index.html
          get /topics/startups-saas/ topics/startups-saas/index.html
          get /robots.txt robots.txt
          get /sitemap.xml sitemap.xml
          get /feed.xml feed.xml
          for f in styles.css site.js agent-control-surface.svg favicon.svg patterns.svg trust.svg og-default.svg; do
            get "/assets/$f" "assets/$f"
          done

      - name: Install publication tooling
        if: steps.gate.outputs.needed == 'true'
        run: python -m pip install --quiet beautifulsoup4 cairosvg pillow

      - name: Generate crawlable raster editorial images
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import cairosvg
          for name in ['agent-control-surface','patterns','trust','og-default']:
              src=Path('assets')/(name+'.svg')
              if src.exists():
                  cairosvg.svg2png(url=str(src), write_to=str(Path('assets')/(name+'.png')), output_width=1600, output_height=900)
          PY

      - name: Apply SEO, indexing and publisher metadata
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json

          ROOT=Path('.')
          BASE='https://interfacereport.com/'
          article_cfg={
            'analysis/ai-agent-control-surface/index.html': {
              'title':'AI Agent UX: Control Surfaces Beyond Chat | Interface Report',
              'description':'AI agent UX is shifting beyond chat. A practical framework for intent, permissions, progress, interruption, approval and recovery in agentic products.',
              'section':'Human–AI',
              'keywords':['AI agent UX','agentic UX','Human–AI interaction','AI permissions','AI product design'],
              'image':BASE+'assets/agent-control-surface.png',
              'alt':'Abstract blue control-surface illustration for AI agent intent, permissions, progress and recovery.'},
            'analysis/trust-before-intelligence/index.html': {
              'title':'AI Product Trust: Design Before Intelligence | Interface Report',
              'description':'Trustworthy AI products make uncertainty, control and recovery visible. Learn the interaction patterns that build confidence before model intelligence.',
              'section':'AI Products',
              'keywords':['AI product trust','trustworthy AI UX','AI product design','Human–AI interaction','AI recovery UX'],
              'image':BASE+'assets/trust.png',
              'alt':'Abstract editorial illustration of layered trust signals, uncertainty and human control in an AI product.'},
            'analysis/agent-ux-patterns/index.html': {
              'title':'Agent UX Patterns: Reveal, Ask, Remember | Interface Report',
              'description':'A practical field guide to agent UX patterns: what AI interfaces should reveal, ask, remember and make recoverable as autonomy increases.',
              'section':'Design & UX',
              'keywords':['agent UX patterns','AI interface patterns','AI agent design','AI product UX','Human–AI UX'],
              'image':BASE+'assets/patterns.png',
              'alt':'Abstract interface-pattern grid illustrating disclosure, memory and recovery states in AI agent UX.'}
          }
          page_cfg={
            'index.html':('Interface Report | AI Products, Agents, Design & Engineering','Independent analysis of AI products, agents, Human–AI interaction, product design, engineering, startups and SaaS for builders and operators.'),
            'latest/index.html':('Latest AI Product & Agent Analysis | Interface Report','Latest Interface Report analysis on AI products, agents, Human–AI interaction, product design, engineering, startups and SaaS.'),
            'authors/oleh-hebel/index.html':('Oleh Hebel — Founder & Editor | Interface Report','Oleh Hebel is the founder and editor of Interface Report, covering AI products, agent UX, Human–AI interaction, product design and technology.'),
            'contact/index.html':('Contact the Editorial Desk | Interface Report','Contact Interface Report for editorial corrections, source material, submissions, partnerships, sponsored content and advertising inquiries.')
          }

          def meta(head, key, value, attr='name'):
              x=head.find('meta',attrs={attr:key})
              if not x:
                  x=head.new_tag('meta') if hasattr(head,'new_tag') else None
              if x:
                  x[attr]=key; x['content']=value
                  if x.parent is None: head.append(x)
              return x

          for p in ROOT.rglob('*.html'):
              if '.git' in p.parts or '.bootstrap' in p.parts: continue
              rel=p.as_posix()
              soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
              head=soup.head
              if not head: continue

              if rel in page_cfg:
                  title,desc=page_cfg[rel]
                  soup.title.string=title
                  d=head.find('meta',attrs={'name':'description'})
                  if d: d['content']=desc
                  for k,a,v in [('og:title','property',title),('og:description','property',desc),('twitter:title','name',title),('twitter:description','name',desc)]:
                      x=head.find('meta',attrs={a:k})
                      if x: x['content']=v

              if not head.find('meta',attrs={'property':'og:locale'}):
                  x=soup.new_tag('meta'); x['property']='og:locale'; x['content']='en_US'; head.append(x)

              # Non-article social preview: branded 1600x900 editorial card.
              if rel not in article_cfg and rel!='404.html':
                  for k,a in [('og:image','property'),('twitter:image','name')]:
                      x=head.find('meta',attrs={a:k})
                      if x: x['content']=BASE+'assets/og-default.png'
                  for k,a in [('og:image:alt','property'),('twitter:image:alt','name')]:
                      if not head.find('meta',attrs={a:k}):
                          x=soup.new_tag('meta'); x[a]=k; x['content']='Interface Report — independent AI product publication'; head.append(x)

              # Upgrade publisher entity without inventing metrics, founders or contact points.
              for script in head.find_all('script',attrs={'type':'application/ld+json'}):
                  try: data=json.loads(script.string or '')
                  except Exception: continue
                  graph=data.get('@graph',[]) if isinstance(data,dict) else []
                  for node in graph:
                      if node.get('@type') in ('Organization','NewsMediaOrganization'):
                          node['@type']='NewsMediaOrganization'
                          node['publishingPrinciples']=BASE+'editorial-guidelines/'
                          node['correctionsPolicy']=BASE+'corrections/'
                          node['ethicsPolicy']=BASE+'editorial-guidelines/'
                      if node.get('@type')=='WebSite':
                          node['alternateName']='InterfaceReport'
                  script.string=json.dumps(data,ensure_ascii=False,separators=(',',':'))

              if rel=='404.html':
                  r=head.find('meta',attrs={'name':'robots'})
                  if r: r['content']='noindex,follow'
                  c=head.find('link',rel='canonical')
                  if c: c.decompose()

              if rel in article_cfg:
                  cfg=article_cfg[rel]
                  soup.title.string=cfg['title']
                  d=head.find('meta',attrs={'name':'description'})
                  if d: d['content']=cfg['description']
                  for k,a,v in [('og:title','property',cfg['title']),('og:description','property',cfg['description']),('twitter:title','name',cfg['title']),('twitter:description','name',cfg['description']),('og:image','property',cfg['image']),('twitter:image','name',cfg['image'])]:
                      x=head.find('meta',attrs={a:k})
                      if x: x['content']=v
                  for k,a in [('og:image:alt','property'),('twitter:image:alt','name')]:
                      x=head.find('meta',attrs={a:k})
                      if not x:
                          x=soup.new_tag('meta'); x[a]=k; head.append(x)
                      x['content']=cfg['alt']
                  if not head.find('meta',attrs={'name':'author'}):
                      x=soup.new_tag('meta'); x['name']='author'; x['content']='Oleh Hebel'; head.append(x)
                  if not head.find('link',rel='author'):
                      x=soup.new_tag('link'); x['rel']='author'; x['href']='/authors/oleh-hebel/'; head.append(x)
                  hero=soup.select_one('figure.article-image img')
                  if hero:
                      hero['src']=cfg['image'].replace(BASE,'/')
                      hero['alt']=cfg['alt']
                      hero['width']='1600'; hero['height']='900'
                  prose=soup.select_one('article.prose')
                  words=len(prose.get_text(' ',strip=True).split()) if prose else 0
                  for script in head.find_all('script',attrs={'type':'application/ld+json'}):
                      try: data=json.loads(script.string or '')
                      except Exception: continue
                      for node in data.get('@graph',[]):
                          if node.get('@type') in ('Article','NewsArticle'):
                              node['image']={'@type':'ImageObject','url':cfg['image'],'contentUrl':cfg['image'],'width':1600,'height':900}
                              node['isAccessibleForFree']=True
                              node['wordCount']=words
                              node['keywords']=cfg['keywords']
                              node['articleSection']=cfg['section']
                      script.string=json.dumps(data,ensure_ascii=False,separators=(',',':'))

              p.write_text(str(soup),encoding='utf-8')

          # Connect visible author identity to an external authoritative profile.
          p=Path('authors/oleh-hebel/index.html')
          if p.exists():
              soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
              if not soup.find('a',href='https://www.linkedin.com/in/olehhebel/'):
                  target=soup.select_one('article.prose') or soup.main
                  a=soup.new_tag('a',href='https://www.linkedin.com/in/olehhebel/')
                  a['rel']='me'; a.string='LinkedIn profile ↗'; target.append(a)
              p.write_text(str(soup),encoding='utf-8')
          PY

      - name: Add technical publishing and IndexNow support
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          mkdir -p scripts .github/workflows
          cat > requirements.txt <<'EOF'
          beautifulsoup4==4.12.3
          EOF
          cat > package.json <<'EOF'
          {"name":"interface-report-media","private":true,"scripts":{"check":"python3 scripts/check_site.py","indexnow":"python3 scripts/indexnow.py"}}
          EOF
          cat > vercel.json <<'EOF'
          {"cleanUrls":true,"trailingSlash":true,"headers":[{"source":"/(.*)","headers":[{"key":"X-Content-Type-Options","value":"nosniff"},{"key":"Referrer-Policy","value":"strict-origin-when-cross-origin"}]},{"source":"/assets/(.*)","headers":[{"key":"Cache-Control","value":"public, max-age=3600, s-maxage=86400, stale-while-revalidate=604800"}]}]}
          EOF
          cat > 60a759d8d9915a4816e0dafdc1128b86.txt <<'EOF'
          60a759d8d9915a4816e0dafdc1128b86
          EOF
          cat > scripts/indexnow.py <<'PY'
          import json,sys,urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          key=Path('60a759d8d9915a4816e0dafdc1128b86.txt').read_text().strip()
          urls=sys.argv[1:]
          if not urls:
              raise SystemExit('Usage: python3 scripts/indexnow.py https://interfacereport.com/path/ [...]')
          if any(urlparse(u).hostname!='interfacereport.com' for u in urls):
              raise SystemExit('Only canonical interfacereport.com URLs are accepted')
          payload={'host':'interfacereport.com','key':key,'keyLocation':f'https://interfacereport.com/{key}.txt','urlList':urls}
          req=urllib.request.Request('https://api.indexnow.org/indexnow',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json; charset=utf-8'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              print(r.status,r.read().decode(errors='replace'))
          PY
          cat > scripts/check_site.py <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,sys
          root=Path('.'); errors=[]; pages=[]
          for p in root.rglob('*.html'):
              if '.git' in p.parts or '.bootstrap' in p.parts: continue
              pages.append(p)
              rel=p.as_posix(); s=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser'); h=s.head
              if not h: errors.append(f'{rel}: missing head'); continue
              robots=h.find('meta',attrs={'name':'robots'}); canonical=h.find('link',rel='canonical')
              if rel=='404.html':
                  if not robots or 'noindex' not in robots.get('content',''): errors.append(f'{rel}: must be noindex')
                  if canonical: errors.append(f'{rel}: must not have canonical')
              else:
                  if not canonical or not canonical.get('href','').startswith('https://interfacereport.com/'): errors.append(f'{rel}: canonical')
                  if not robots or 'index' not in robots.get('content',''): errors.append(f'{rel}: indexability')
              if not s.title or not h.find('meta',attrs={'name':'description'}): errors.append(f'{rel}: title/description')
              if not h.find('meta',attrs={'property':'og:image'}) or not h.find('meta',attrs={'name':'twitter:image'}): errors.append(f'{rel}: social image')
              if not h.find('meta',attrs={'property':'og:locale'}): errors.append(f'{rel}: og locale')
              for x in h.find_all('script',attrs={'type':'application/ld+json'}):
                  try: json.loads(x.string or '')
                  except Exception: errors.append(f'{rel}: invalid JSON-LD')
              if rel.startswith('analysis/'):
                  if len(s.title.get_text())>65: errors.append(f'{rel}: title too long')
                  desc=h.find('meta',attrs={'name':'description'}).get('content','')
                  if not 120<=len(desc)<=165: errors.append(f'{rel}: description length {len(desc)}')
                  if not h.find('meta',attrs={'name':'author'}) or not h.find('link',rel='author'): errors.append(f'{rel}: author metadata')
                  if not h.find('meta',attrs={'property':'og:image:alt'}) or not h.find('meta',attrs={'name':'twitter:image:alt'}): errors.append(f'{rel}: social image alt')
                  prose=s.select_one('article.prose')
                  if not prose or len(prose.get_text(' ',strip=True).split())<700: errors.append(f'{rel}: thin article')
              # Local internal link integrity.
              for a in s.find_all('a',href=True):
                  href=a['href']
                  if not href.startswith('/') or href.startswith('//') or href.startswith('/#'): continue
                  path=href.split('#')[0].split('?')[0]
                  if path in ('','/'): target=root/'index.html'
                  elif path.endswith('/'): target=root/path.lstrip('/')/'index.html'
                  else: target=root/path.lstrip('/')
                  if not target.exists(): errors.append(f'{rel}: broken internal link {href}')
          robots=Path('robots.txt').read_text(encoding='utf-8')
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          if 'User-agent: OAI-SearchBot' not in robots or 'Allow: /' not in robots: errors.append('robots: OAI-SearchBot')
          if 'User-agent: GPTBot' not in robots or 'Disallow: /' not in robots: errors.append('robots: GPTBot policy')
          if 'https://interfacereport.com/' not in sitemap or '404.html' in sitemap: errors.append('sitemap')
          for f in ['assets/agent-control-surface.png','assets/patterns.png','assets/trust.png','assets/og-default.png','feed.xml','60a759d8d9915a4816e0dafdc1128b86.txt']:
              if not Path(f).exists(): errors.append(f'missing {f}')
          print(f'HTML files checked: {len(pages)}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('All internal links, canonical/meta, JSON-LD, article depth, crawler and indexing checks passed.')
          PY
          cat > .github/workflows/qa.yml <<'EOF'
          name: Publication QA
          on:
            push:
              branches: [main, "launch/**"]
            pull_request:
          permissions:
            contents: read
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - run: pip install -r requirements.txt
                - run: python scripts/check_site.py
          EOF
          cat > README.md <<'EOF'
          # Interface Report

          Independent media publication about AI products, agents, Human–AI interaction, product design, engineering, startups and SaaS.

          Canonical domain: https://interfacereport.com/

          ## Technical publishing
          - Static crawlable HTML and clean canonical URLs
          - XML sitemap and RSS feed
          - NewsMediaOrganization, WebSite, Person and Article structured data
          - OAI-SearchBot allowed; GPTBot policy controlled separately
          - Story-specific 1600×900 article images
          - IndexNow support for newly published or materially changed URLs
          - GitHub Actions publication QA on pushes and pull requests

          Do not submit IndexNow until the custom domain and key file resolve publicly. Add the property to Google Search Console after DNS/HTTPS is live, submit `/sitemap.xml`, and inspect representative canonical URLs.
          EOF

      - name: Run publication QA
        if: steps.gate.outputs.needed == 'true'
        run: python scripts/check_site.py

      - name: Commit full source
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          rm -rf .bootstrap .bootstrap-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bootstrap full Interface Report source'
          git push
